<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Motoras - Asistencia mecánica inteligente</title>
<link rel="stylesheet" href="css/estilo.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
</head>
<body>
<header>
  <img src="img/logo.png" alt="Motoras" class="logo" onerror="this.style.display='none'">
  <h1>MOTORAS</h1>
  <p>Asistencia mecánica inteligente con IA</p>
</header>
<nav>
  <button onclick="mostrar('inicio')">Inicio</button>
  <button onclick="mostrar('usuario')">Usuario</button>
  <button onclick="mostrar('diagnostico')">IA Mecánica</button>
  <button onclick="mostrar('servicios')">Servicios</button>
  <button onclick="mostrar('prestador')">Prestadores</button>
  <button onclick="mostrar('pago')">Pago</button>
  <button onclick="mostrar('calificacion')">Calificar</button>
</nav>
<main>
  <section id="inicio" class="activo"><div class="card"><h2>Bienvenido a Motoras</h2></div></section>
  <section id="usuario">
    <div class="card">
      <h2>Mi cuenta</h2>
      <div id="usuarioAuthBox">
        <div class="tabs">
          <button class="tab-btn activo-tab" onclick="cambiarTab('usuario','login',this)">Iniciar sesión</button>
          <button class="tab-btn" onclick="cambiarTab('usuario','registro',this)">Registrarse</button>
        </div>
        <div id="usuario-login" class="tab-panel activo-tab-panel">
          <input id="loginEmailUsuario" type="email" placeholder="Email">
          <input id="loginPassUsuario" type="password" placeholder="Contraseña">
          <button class="btn" onclick="iniciarSesionUsuarioReal()">Iniciar sesión</button>
        </div>
        <div id="usuario-registro" class="tab-panel">
          <input id="nombre" placeholder="Nombre completo">
          <input id="email" type="email" placeholder="Email">
          <input id="passUsuario" type="password" placeholder="Contraseña (min 6)">
          <h3>Datos del vehículo</h3>
          <input id="auto" placeholder="Marca y modelo">
          <input id="anio" type="number" placeholder="Año">
          <input id="motor" placeholder="Motor">
          <button class="btn" onclick="registrarUsuarioReal()">Crear cuenta</button>
        </div>
        <div id="usuarioResultado" class="resultado" style="display:none;"></div>
      </div>
      <div id="usuarioPanel" style="display:none;"><h3>¡Bienvenido!</h3><button class="btn" onclick="cerrarSesionUsuario()">Cerrar sesión</button></div>
    </div>
  </section>
  <section id="diagnostico"><div class="card"><h2>🤖 Motoras IA</h2><textarea id="problema"></textarea><input id="codigo" placeholder="Código OBD2"><button class="btn" onclick="guardarDiagnosticoReal()">Analizar</button><div id="respuestaIA" class="resultado"></div></div></section>
  <section id="servicios"><div class="card"><h2>🔧 Solicitar asistencia</h2><select id="tipoServicio"><option>Mecánico móvil</option><option>Grúa</option><option>Taller</option></select><input id="ubicacion" readonly><button class="btn" onclick="usarMiUbicacionPedido()">📍 Usar mi ubicación</button><button class="btn" onclick="guardarPedidoReal()">Buscar ayuda</button><div id="servicioResultado" class="resultado" style="display:none;"></div><div id="ubicacionServiciosTexto" class="resultado"></div><div id="mapaServicios" style="height:350px;"></div></div></section>
  <section id="prestador"><div class="card"><h2>🛠 Prestador</h2><div id="prestadorAuthBox"><div id="prestador-login" class="tab-panel activo-tab-panel"><input id="loginEmailPrestador"><input id="loginPassPrestador" type="password"><button class="btn" onclick="iniciarSesionPrestadorReal()">Entrar</button></div><div id="prestador-registro" class="tab-panel"><input id="nombrePrestador"><input id="emailPrestador"><input id="passPrestador" type="password"><select id="tipoPrestador"><option>Taller</option><option>Grúa</option><option>Mecánico móvil</option></select><input id="zonaPrestador"><button class="btn" onclick="registrarPrestadorReal()">Registrarme</button></div><div id="prestadorResultado" class="resultado" style="display:none;"></div></div><div id="prestadorPanel" style="display:none;"><button class="btn" onclick="cargarPedidosReal()">Actualizar pedidos</button><div id="listaPedidos"></div><button class="btn" onclick="cerrarSesionPrestador()">Cerrar sesión</button></div></div></section>
  <section id="pago"><div class="card"><h2>💰 Pago</h2><button class="btn" onclick="pagarConMercadoPago()">Mercado Pago</button><div id="pagoResultado" class="resultado" style="display:none;"></div><div id="paypal-button-container"></div></div></section>
  <section id="calificacion"><div class="card"><h2>⭐ Calificar</h2><select id="estrellas"><option>⭐⭐⭐⭐⭐</option></select><button class="btn" onclick="guardarCalificacionReal()">Enviar</button><div id="calificacionResultado" class="resultado" style="display:none;"></div></div></section>
</main>
<footer>Motoras © 2026</footer>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script type="module" src="js/config.js"></script>
<script type="module" src="js/app.js"></script>
</body>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                         </html>
